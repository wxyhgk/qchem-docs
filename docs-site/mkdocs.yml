site_name: Q-Chem 7.0 User's Manual
site_description: Q-Chem 7.0 量子化学软件用户手册与理论指南
site_author: Q-Chem, Inc.
site_url: ''
use_directory_urls: true
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.tracking
  - navigation.sections
  - navigation.top
  - navigation.footer
  - navigation.path
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.tabs.link
  - toc.follow
  logo: assets/logo.svg
  favicon: assets/1.png
plugins:
- search
- i18n:
    docs_structure: folder
    languages:
    - locale: en
      default: true
      name: English
      build: true
    - locale: zh
      name: 中文
      build: true
      site_name: Q-Chem 7.0 用户手册
